<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7D39EB">
  <meta name="description" content="Graces Digital — ideias, design e digital.">
  <title>Graces Digital | Bora criar?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/logo-graces.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="canvas">
    <div class="paper-grain" aria-hidden="true"></div>
    <span class="burst burst-a" aria-hidden="true">✳</span>
    <span class="burst burst-b" aria-hidden="true">✷</span>
    <span class="scribble scribble-a" aria-hidden="true">〰</span>
    <span class="scribble scribble-b" aria-hidden="true">↗</span>
    <span class="sticker sticker-top" aria-hidden="true">Mais ideias<br>fora da caixa</span>

    <section class="phone-card" aria-label="Links da Graces Digital">
      <div class="phone-top">
        <span class="camera"></span>
        <span class="phone-speaker"></span>
        <span class="phone-dot"></span>
      </div>

      <div class="screen">
        <div class="screen-header">
          <span>◂</span>
          <span>GRACES DIGITAL</span>
          <span>▸</span>
        </div>

        <div class="screen-content">
          <div class="logo-holder">
        
            
          </div>

          <p class="mini-label">Sua ideia merece ganhar forma</p>
          <h1>VAMOS<br><span>CRIAR?</span></h1>
          <p class="screen-copy"></p>

          <nav class="links" aria-label="Links principais">
            <a class="link link-whatsapp" id="whatsappLink"
               href="https://wa.me/5511916788446?text=Ol%C3%A1%21%20Quero%20conversar%20sobre%20um%20projeto."
               target="_blank" rel="noopener noreferrer">
              <span class="link-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.4-4A8 8 0 1 1 20 11.5Z"/><path d="M9 8.2c-.2-.4-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.4-.2.2-.8.8-.8 1.9s.8 2.2.9 2.3c.1.2 1.5 2.5 3.8 3.3 1.9.7 2.3.6 2.7.5.4-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1-.1-.1-.2-.2-.5-.3l-1.5-.7c-.2-.1-.4-.1-.5.1l-.7.8c-.1.2-.3.2-.5.1-.2-.1-.9-.3-1.8-1.1-.7-.6-1.1-1.3-1.2-1.5-.1-.2 0-.4.1-.5l.3-.4c.1-.1.2-.2.2-.4.1-.1 0-.3 0-.4L9 8.2Z"/></svg>
              </span>
              <span class="link-text"><strong>Chama no WhatsApp</strong><small>Vamos tirar a ideia do papel</small></span>
              <span class="link-arrow">↗</span>
            </a>

            <a class="link link-site" id="siteLink" href="https://gracesdigital.com" target="_blank" rel="noopener noreferrer">
              <span class="link-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.4 2.5 3.5 5.5 3.5 9S14.4 18.5 12 21c-2.4-2.5-3.5-5.5-3.5-9S9.6 5.5 12 3Z"/></svg>
              </span>
              <span class="link-text"><strong>Conheça nosso site</strong><small>Veja o que a gente faz</small></span>
              <span class="link-arrow">↗</span>
            </a>
          </nav>

          <p class="screen-footer">TOCA AÍ E BORA CRIAR <span>✦</span></p>
        </div>
      </div>

      <div class="phone-controls" aria-hidden="true">
        <span class="control control-left"></span>
        <span class="control control-main"></span>
        <span class="control control-right"></span>
      </div>
      <div class="phone-brand">GRACES <span></span> DIGITAL</div>
    </section>

    <div class="bottom-sticker">SUA PRÓXIMA<br>IDEIA COMEÇA AQUI <span>↗</span></div>
    
  </main>
</body>
</html>
